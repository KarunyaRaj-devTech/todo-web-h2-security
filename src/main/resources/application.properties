# application.properties

spring.application.name=umasuraj-springboot-web-application-h2-database

server.port=8081


# /src/main/resources/META-INF/resources/WEB-INF/jsp/
# sayHello.jsp
# /WEB-INF/jsp/login.jsp => View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

logging.level.org.springframework=info
logging.level.in.umasuraj.springboot.web=debug

spring.mvc.format.date=yyyy-MM-dd

spring.datasource.url=jdbc:h2:mem:db_todo

# To delay the execution of data.sql before entities are processed
spring.jpa.defer-datasource-initialization=true 

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true